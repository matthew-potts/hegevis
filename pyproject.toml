[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hegevis"
version = "0.1.0"
description = "House data-visualisation style for the geoeconomics publication: consistent colour, type and chart furniture across every article."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.24",
]

[project.optional-dependencies]
pandas = ["pandas>=2.0"]
dev = ["pandas>=2.0", "pytest>=7.0"]

[project.scripts]
hegevis-validate = "hegevis.validate:main"
hegevis-brand = "hegevis.brand:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hegevis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
