# =============================================================================
#  HOUSE THEME  --  Helsinki Geoeconomics Society
#
#  The one file you edit to change how every chart looks. Change a value here
#  and every chart in every article follows, with no analyst touching anything.
#
#  After editing colours, ALWAYS re-run:
#      hegevis-validate                 # categorical slots, adjacent pairs
#      hegevis-validate --pairs all     # stricter, for scatter/map forms
#      hegevis-validate --ordinal       # the magnitude ramp
# =============================================================================

name = "Helsinki Geoeconomics Society"

# -- Typography ---------------------------------------------------------------
# The publication is set in Tiempos Headline (display serif) and Gill Sans
# (humanist sans). Both are LICENSED faces and are deliberately not shipped in
# the package -- drop your licensed copies into src/hegevis/assets/fonts/ and
# hegevis registers them with matplotlib at import.
#
# Both faces are used, in the roles the sample spread uses them for: Tiempos
# Headline sets the headline, Gill Sans sets everything else.
#
# The chart title is a headline, so it takes the serif. The SUBTITLE does not:
# it is a running gloss, it wraps to two and three lines, and Tiempos Headline
# is a display face drawn for 60pt -- at 8.5pt over three lines its thin
# strokes break up in print. Everything from the subtitle down is the sans.
#
# Set title_family = [] to put chart titles back in the sans.
[type]
family       = ["Gill Sans", "Gill Sans MT", "Helvetica Neue", "DejaVu Sans"]
title_family = ["Tiempos Headline", "Tiempos Text", "Charter", "Georgia"]

weight_normal = 400
weight_medium = 500
weight_bold   = 600

# ONE text size for everything inside the chart. The old scale had five sizes
# doing five slightly different jobs; a reader cannot decode a hierarchy that
# fine at 88mm, and the variation just made charts look busy. Title and
# subtitle step up; the footnote steps well down and is the only thing smaller.
[type.size]
title    = 10.0
subtitle = 8.5
body     = 7.0   # ticks, axis titles, series labels, value labels -- all of it
footnote = 5.5   # source and note: deliberately small, it is not the story

# -- Colour -------------------------------------------------------------------
# The off-white ground is the chart's most recognisable feature: it fills the
# whole box, edge to edge, and every chart has it. Nothing is drawn on white.
[color]
surface   = "#e9e6de"   # the off-white box: the chart's own ground
page      = "#f5f1e7"   # the cream of the page behind the box

ink       = "#2a1a24"   # titles, primary text
ink_soft  = "#5e4855"   # subtitles, series labels
ink_muted = "#7a6772"   # ticks, axis titles, footnote
neutral   = "#a89aa1"   # de-emphasis grey for context series
axis      = "#2a1a24"   # the baseline is real ink, not a hairline
grid      = "#d6cfd2"   # hairline gridlines

# The masthead tab: the solid rectangle top-left that opens every chart. It is
# the brand orange rather than a borrowed red -- the layout is the convention,
# the colour is ours.
tab       = "#d1703a"

# Categorical slots, IN FIXED ORDER. Slots 1-2 are the brand's own colours and
# carry most charts, since most charts have two or three series. Slots 3-8 are
# spaced away in hue and matched to the brand's lightness and chroma. Every
# adjacent pair clears the colour-vision gates.
series = [
  "#d1703a",  # 1 brand orange, darkened for print
  "#962241",  # 2 brand burgundy, lifted into band
  "#0097aa",  # 3 teal
  "#aa8400",  # 4 ochre
  "#277fce",  # 5 blue
  "#628b14",  # 6 olive
  "#7c69cb",  # 7 violet
  "#009e78",  # 8 green
]

# Magnitude ramp: the brand orange, light -> dark.
#
# Rebuilt when the ground moved from the old cream (#f5f1e7) to the darker
# off-white above. The old ramp opened at #ffe1d2, which was 1.01:1 against
# this surface -- a step the reader simply cannot see, and only four of its
# seven steps still cleared the floor, so Palette.ordinal() started repeating.
#
# Nine steps now, and the split is deliberate. The first two sit BELOW the
# ordinal floor on purpose: that is what makes "near zero" recede toward the
# paper on a heatmap. The remaining seven all clear it, which is what
# Palette.ordinal() draws on for discrete bands -- so both jobs are covered
# without one compromising the other.
#     hegevis-validate --ordinal
sequential = [
  "#f1c7b2", "#ddad95",                                        # heatmap-only
  "#ca9378", "#b67a5c", "#a3613f", "#8f4921", "#793200",       # discrete steps
  "#5b2400", "#3f1600",
]

[color.diverging]
low  = "#277fce"
mid  = "#e2dcdf"
high = "#d1703a"

[color.status]
good     = "#0ca30c"
warning  = "#fab219"
serious  = "#ec835a"
critical = "#d03b3b"

# -- Persistent entity colours ------------------------------------------------
# "Colour follows the entity, never its rank": if China is slot 2 in one
# article it is slot 2 in every article.
[entities]
# "United States"  = 0
# "China"          = 1

# -- Print geometry -----------------------------------------------------------
# Widths in MILLIMETRES. Charts are BOXES, slightly taller than wide -- the
# proportion the sample charts use, and the one that fits a column well.
[layout]
col1  = 88.0
col15 = 120.0
col2  = 180.0
page  = 180.0

default_ratio = 1.15   # height / width: portrait, slightly taller than wide

# Margins are measured from the edge of the OFF-WHITE BOX, not the trim: the
# box is the chart, so its own padding is what the reader sees.
#
# The foot is 9mm: enough for the x labels and a 5.5pt source line, and no
# more. It used to reserve room for a logo in the bottom-right corner; the tab
# carries the branding now, so that space went back to the plot.
[layout.margin]
left   = 13.0
right  = 9.0
top    = 22.0   # room for the tab, title and subtitle
bottom = 9.0

# -- The masthead tab ---------------------------------------------------------
# The solid rectangle at the top-left of every chart, above the title.
[tab]
width_mm  = 14.0
height_mm = 2.2
top_mm    = 4.5   # from the top edge of the box

# -- Text limits --------------------------------------------------------------
# Word counts, enforced not suggested. A chart title that needs 18 words is an
# article paragraph wearing a chart's clothes; hegevis warns so it gets cut
# before it reaches the page rather than after.
[text]
title_words    = 8
subtitle_words = 14
footnote_words = 20

# -- CMYK declarations --------------------------------------------------------
[cmyk]
# "#d1703a" = [0, 60, 78, 6]
